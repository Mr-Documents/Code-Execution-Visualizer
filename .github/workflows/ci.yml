name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24+ runs the TypeScript test helpers directly via type stripping.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install extension dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci
        working-directory: webview-ui

      - name: Build extension (includes type-check)
        run: npm run compile

      - name: Build webview (includes type-check)
        run: npm run build:webview

      - name: Run tracer integration tests
        run: npm run test:tracer

      - name: Run webview unit tests
        run: npm test
        working-directory: webview-ui
